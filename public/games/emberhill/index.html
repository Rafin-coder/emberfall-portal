<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ember Hill — Ember Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:"Space Grotesk",system-ui,sans-serif}
:root{--bg:#08080e;--text:#ece9f5;--muted:#8d8aa0;--ember:#ff7a3c;--ember2:#ffb04d;--cool:#5fe3c8;--danger:#ff5d6c;--gold:#ffd27a;--line:rgba(255,255,255,.1)}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:14px;padding:10px 14px 0 104px;pointer-events:none;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat .v{font:600 19px/1 "Space Grotesk";color:#fff}
.stat .k{font:500 9px/1 "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stat.dist .v{color:var(--ember2)} .stat.coin .v{color:var(--gold)}
.icn{display:inline-block;margin-right:4px}
.fuelwrap{margin-left:auto;min-width:140px}
.flab{font:500 9px/1 "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:#8d8aa0}
.fuelbar{height:11px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px;border:1px solid var(--line)}
.fuelbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7a3c,#ffd27a);transition:width .1s}
#back{position:fixed;top:9px;left:12px;z-index:40;font:600 12px/1 "Space Grotesk";letter-spacing:.05em;color:#bfb9d6;
  background:rgba(8,8,14,.7);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:9px;padding:8px 12px;text-decoration:none}
.tbtn{position:fixed;top:9px;z-index:40;width:38px;height:34px;font-size:15px;cursor:pointer;
  background:rgba(8,8,14,.7);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:9px;color:#ffb04d}
#sound{right:12px} #pause{right:58px} #sound.off{color:#6b6878}
#dailyBadge{display:none;position:fixed;top:46px;left:50%;transform:translateX(-50%);z-index:40;font:600 11px/1 "JetBrains Mono",monospace;
  letter-spacing:.12em;color:#ffd27a;background:rgba(8,8,14,.7);backdrop-filter:blur(8px);border:1px solid rgba(255,176,77,.35);border-radius:9px;padding:7px 11px}
#pedals{position:fixed;left:0;right:0;bottom:0;height:42%;display:flex;z-index:20;pointer-events:none}
.pedal{flex:1;pointer-events:auto;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;
  font:700 13px "Space Grotesk";letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.pedal.gas{background:linear-gradient(0deg,rgba(255,122,60,.16),transparent 80%)}
.pedal.brake{background:linear-gradient(0deg,rgba(95,227,200,.12),transparent 80%)}
.pedal.on{color:#fff}
.pedal.gas.on{background:linear-gradient(0deg,rgba(255,122,60,.34),transparent 80%)}
.pedal.brake.on{background:linear-gradient(0deg,rgba(95,227,200,.28),transparent 80%)}
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(700px 400px at 50% 34%,rgba(255,122,60,.12),transparent 70%),rgba(6,6,12,.86);backdrop-filter:blur(6px);overflow:auto}
.overlay.hidden{display:none}
.panel{text-align:center;padding:26px 30px;max-width:520px;width:100%}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ember);margin-bottom:12px}
.panel h1{font-size:44px;font-weight:700;line-height:1;background:linear-gradient(120deg,#fff,var(--ember2));-webkit-background-clip:text;background-clip:text;color:transparent}
.panel h2{font-size:28px;font-weight:700;color:var(--ember2)}
.panel p{color:var(--muted);margin-top:12px;font-size:14px;line-height:1.55}
.panel .big{font-family:"JetBrains Mono",monospace;font-size:44px;color:var(--ember2);margin:4px 0}
.cur{display:flex;gap:18px;justify-content:center;align-items:center;font-family:"JetBrains Mono",monospace;color:var(--gold);font-size:15px;margin-top:4px}
.modebtns{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn{font:600 15px/1 "Space Grotesk";letter-spacing:.03em;color:#0c0a08;cursor:pointer;background:linear-gradient(120deg,var(--ember),var(--ember2));border:none;border-radius:11px;padding:13px 22px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:#bfb9d6;border:1px solid var(--line)}
.nav{display:flex;gap:8px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.nav button{font:700 12px "Space Grotesk";letter-spacing:.06em;text-transform:uppercase;color:#bfb9d6;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer}
.nav button.play{color:#0c0a08;background:linear-gradient(120deg,var(--ember),var(--ember2));border:none}
.nav button.on{color:#fff;border-color:var(--ember)}
#vprev{width:100%;max-width:300px;height:130px;display:block;margin:6px auto 2px;border-radius:14px;background:linear-gradient(180deg,#10101a,#1a1426);border:1px solid var(--line)}
.cards{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;justify-content:flex-start}
.card{flex:0 0 150px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:left}
.card.sel{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset}
.card .nm{font-size:14px;font-weight:600;color:#fff}
.card .st{font:500 10px/1.5 "JetBrains Mono",monospace;color:var(--muted);margin:7px 0}
.card .sb{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin:3px 0 6px;overflow:hidden}
.card .sb i{display:block;height:100%;background:linear-gradient(90deg,#ff7a3c,#ffd27a)}
.card button{width:100%;font:600 12px "JetBrains Mono",monospace;color:#0c0a08;background:linear-gradient(120deg,var(--gold),#ffe6b0);border:none;border-radius:9px;padding:9px;cursor:pointer;margin-top:4px}
.card button.owned{background:transparent;color:var(--cool);border:1px solid var(--line)}
.card button:disabled{opacity:.45;cursor:default;background:#333;color:#999}
.uprow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;text-align:left}
.uprow .ic{width:40px;height:40px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:20px;background:rgba(255,206,122,.1);border:1px solid var(--line)}
.uprow .ii{flex:1;min-width:0}
.uprow .t{font-size:14px;font-weight:600;color:#fff}
.uprow .d{font-size:11px;color:var(--muted);margin-top:2px}
.lvbar{display:flex;gap:3px;margin-top:5px}
.lvbar span{flex:1;height:6px;border-radius:2px;background:rgba(255,255,255,.1)}
.lvbar span.f{background:var(--cool)}
.upbtn{flex:none;font:600 12px "JetBrains Mono",monospace;color:#0c0a08;background:linear-gradient(120deg,var(--gold),#ffe6b0);border:none;border-radius:9px;padding:9px 12px;cursor:pointer}
.upbtn:disabled{opacity:.4;cursor:default;background:#333;color:#999}
.scr{display:none} .scr.on{display:block}
#lbBox{margin:6px 0 2px}#netLine{font-size:12px}
</style>
</head>
<body>
<a id="back" href="/">← Arcade</a>
<button id="pause" class="tbtn" title="Pause" style="display:none">❚❚</button>
<button id="sound" class="tbtn" title="Son">♪</button>
<div id="dailyBadge"></div>

<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="stat dist"><span class="v" id="dist">0 m</span><span class="k">distance</span></div>
    <div class="stat"><span class="v" id="spd">0</span><span class="k">km/h</span></div>
    <div class="stat coin"><span class="v"><span class="icn">◉</span><span id="coins">0</span></span><span class="k">pièces</span></div>
    <div class="fuelwrap"><div class="flab">⛽ carburant</div><div class="fuelbar"><i id="fuel"></i></div></div>
  </div>
  <div id="pedals">
    <div class="pedal brake" id="pBrake">◀ frein</div>
    <div class="pedal gas" id="pGas">gaz ▶</div>
  </div>
</div>

<!-- MENU + écrans -->
<div class="overlay" id="menu">
  <div class="panel">
    <div class="eyebrow">ember arcade</div>
    <h1>Ember Hill</h1>
    <div class="cur"><span>◉ <b id="hdrCoins">0</b></span><span style="color:var(--muted)">·</span><span>record <b id="hdrBest">0</b> m</span></div>

    <!-- écran JOUER -->
    <div class="scr on" id="scrPlay">
      <canvas id="vprev"></canvas>
      <div id="playInfo" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-top:4px"></div>
    </div>
    <!-- écran VÉHICULES -->
    <div class="scr" id="scrVeh"><div class="cards" id="vehCards"></div></div>
    <!-- écran STAGES -->
    <div class="scr" id="scrStage"><div class="cards" id="stageCards"></div></div>
    <!-- écran GARAGE -->
    <div class="scr" id="scrGarage"><div id="upList" style="margin-top:6px"></div></div>

    <div class="nav">
      <button class="play" id="navPlay">▶ Jouer</button>
      <button id="navVeh">Véhicules</button>
      <button id="navStage">Stages</button>
      <button id="navGarage">Garage</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="panel">
    <div class="eyebrow" id="overTitle">épave</div>
    <div class="big" id="overScore">0 m</div>
    <div id="overSub" style="font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:13px"></div>
    <p id="netLine"></p>
    <div id="lbBox"></div>
    <div class="modebtns">
      <button class="btn" id="retryBtn">Rejouer</button>
      <button class="btn ghost" id="toMenuBtn">Menu</button>
    </div>
  </div>
</div>

<script src="/config.js"></script>
<script src="/sdk.js"></script>
<script>
(function(){
  const cv=document.getElementById('c'), ctx=cv.getContext('2d');
  let W=innerWidth,H=innerHeight,DPR=Math.min(2,devicePixelRatio||1);
  function fit(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  addEventListener('resize',fit); fit();

  // ---------- audio ----------
  let AC=null,eng=null,engGain=null,muted=localStorage.getItem('eh:mute')==='1';
  function ac(){ if(AC)return; try{AC=new(window.AudioContext||window.webkitAudioContext)();
    eng=AC.createOscillator();eng.type='triangle';eng.frequency.value=44;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;
    engGain=AC.createGain();engGain.gain.value=0;
    eng.connect(lp).connect(engGain).connect(AC.destination);eng.start();}catch(e){} }
  function blip(f,d,t,v){ if(!AC||muted)return; const n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v||.04,n+.01);
    g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d+.02);}
  function engineSound(speed){ if(!engGain)return;
    const tgt=(muted||G.state!=='play')?0:(0.005+Math.min(0.014,Math.abs(speed)*0.00004));
    engGain.gain.value+=(tgt-engGain.gain.value)*0.08;
    if(eng){const f=40+Math.min(110,Math.abs(speed)*0.42); eng.frequency.value+=(f-eng.frequency.value)*0.08;} }
  const sb=document.getElementById('sound');
  function refreshSound(){sb.textContent=muted?'♪̸':'♪';sb.classList.toggle('off',muted);}
  sb.onclick=()=>{muted=!muted;localStorage.setItem('eh:mute',muted?'1':'0');refreshSound();}; refreshSound();

  function clamp(v,a,b){return v<a?a:v>b?b:v;}
  function angNorm(a){while(a>Math.PI)a-=6.283185;while(a<-Math.PI)a+=6.283185;return a;}
  function lrng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return ()=>{s=s*16807%2147483647;return (s-1)/2147483646;};}

  // ---------- stages (décors) ----------
  const BIOMES=[
    {id:'hills', name:'Collines', hint:'Le classique vallonné.', sky:['#0a0918','#1c1430','#3a2238'], gnd:['#46304f','#2a1c33','#140d1a'], rim:'#ff7a3c', star:'#dcdcff', grav:1650, ampMul:1.0, decor:'tree',cost:0},
    {id:'desert',name:'Désert de braise', hint:'Dunes chaudes, bosses sèches.', sky:['#1a0c10','#3a1a16','#5a2c1c'], gnd:['#8a5232','#52301c','#23130a'], rim:'#ffb04d', star:'#ffe0b0', grav:1650, ampMul:0.85, decor:'cactus',cost:800},
    {id:'moon',  name:'Lune morte', hint:'Faible gravité — sauts énormes.', sky:['#04050d','#0b1024','#171c38'], gnd:['#3c3c4c','#222230','#0f0f17'], rim:'#9fb8ff', star:'#ffffff', grav:620, ampMul:1.35, decor:'rock',cost:2500},
  ];
  function ownedStages(){try{return JSON.parse(localStorage.getItem('eh:stages'))||['hills'];}catch(e){return ['hills'];}}
  function saveStages(a){localStorage.setItem('eh:stages',JSON.stringify(a));}
  function biomeIndex(){ if(DAILY){let h=0;for(const c of DAILY.date)h+=c.charCodeAt(0);return h%BIOMES.length;}
    let i=clamp(+(localStorage.getItem('eh:stage')||0),0,BIOMES.length-1);
    if(!ownedStages().includes(BIOMES[i].id)) i=0;   // pas acheté -> Collines
    return i; }
  function currentBiome(){return BIOMES[biomeIndex()];}

  // ---------- véhicules ----------
  const VEHICLES=[
    {id:'buggy', name:'Buggy Braise', cost:0,    ef:1450, top:540, fuel:100, grip:1.00, air:3.2, wb:24, wr:14, body:'buggy'},
    {id:'moto',  name:'Moto Cendre',  cost:1200, ef:1680, top:640, fuel:80,  grip:0.92, air:4.3, wb:18, wr:13, body:'moto'},
    {id:'truck', name:'Camion Forge', cost:4000, ef:1320, top:470, fuel:150, grip:1.18, air:2.4, wb:30, wr:16, body:'truck'},
  ];
  function ownedVeh(){try{return JSON.parse(localStorage.getItem('eh:veh'))||['buggy'];}catch(e){return ['buggy'];}}
  function saveOwned(a){localStorage.setItem('eh:veh',JSON.stringify(a));}
  function selVehId(){return localStorage.getItem('eh:car')||'buggy';}
  function currentVehicle(){return VEHICLES.find(v=>v.id===selVehId())||VEHICLES[0];}

  // ---------- garage / améliorations ----------
  const UPG=[
    {id:'engine',ic:'⚙',name:'Moteur',desc:'Accélération et vitesse de pointe.',max:8,cost:l=>120+l*120},
    {id:'tank',ic:'⛽',name:'Réservoir',desc:'Carburant au départ.',max:8,cost:l=>100+l*110},
    {id:'grip',ic:'❂',name:'Adhérence',desc:'Grimpe mieux les côtes raides.',max:6,cost:l=>140+l*140},
    {id:'wing',ic:'✦',name:'Aileron',desc:'Contrôle de rotation en l\'air.',max:6,cost:l=>130+l*130},
  ];
  function getCoins(){ return (window.GamePortal&&GamePortal.getCoins)?GamePortal.getCoins():+(localStorage.getItem('eh:coins')||0); }
  function setCoins(v){ v=Math.max(0,Math.round(v)); if(window.GamePortal&&GamePortal.setCoins)GamePortal.setCoins(v); else localStorage.setItem('eh:coins',v); }
  function loadUp(){try{return JSON.parse(localStorage.getItem('eh:up'))||{};}catch(e){return {};}}
  function saveUp(u){localStorage.setItem('eh:up',JSON.stringify(u));}

  // ---------- état / stats ----------
  const REST=22, BF=1100;
  let G={state:'menu'}, cans=[], coins=[], decos=[], pops=[], up={};
  let BIOME=BIOMES[0], VEH=VEHICLES[0];  // valeurs sûres ; applyLoadout() met les vraies avant tout usage
  let EF=1450, TOP=540, FUELMAX=100, GRIPK=1, AIRROT=3.2, GRAV=1650;
  function applyLoadout(){
    // Défi du jour = mêmes conditions pour tous : véhicule de base + aucune amélioration garage.
    // Le stage est déjà imposé par biomeIndex(). En partie normale, on prend ton vrai loadout.
    up=DAILY?{}:loadUp(); VEH=DAILY?VEHICLES[0]:currentVehicle(); BIOME=currentBiome();
    EF=VEH.ef+(up.engine||0)*150; TOP=VEH.top+(up.engine||0)*38;
    FUELMAX=VEH.fuel+(up.tank||0)*22; GRIPK=VEH.grip*(1-(up.grip||0)*0.10);
    AIRROT=(VEH.air+(up.wing||0)*0.45)*0.5; GRAV=BIOME.grav; }  // ×0.5 : rotation aérienne contrôlable
  function ground(x){
    const amp=(42+Math.min(140,x*0.010))*BIOME.ampMul;
    return H*0.62 - Math.sin(x*0.0040+P1)*amp - Math.sin(x*0.0091+P2)*amp*0.40
      - Math.sin(x*0.0195+P3)*amp*0.16 - Math.sin(x*0.00075+P4)*72;
  }
  function slopeAt(x){const d=6;return Math.atan2(ground(x+d)-ground(x-d),2*d);}
  let DAILY=null, SEED=(Math.random()*99999)|0, P1=0,P2=0,P3=0,P4=0;
  function seedTerrain(rng){ P1=rng()*6.28;P2=rng()*6.28;P3=rng()*6.28;P4=rng()*6.28; }
  function flatStart(){let bx=40,bs=9;for(let x=40;x<460;x+=10){const s=Math.abs(slopeAt(x));if(s<bs){bs=s;bx=x;}}return bx;}
  const COIN_TIERS=[{v:1,d:0},{v:2,d:150},{v:5,d:400},{v:10,d:800},{v:25,d:1500},{v:50,d:2500},{v:100,d:4000},{v:500,d:7000}];
  function coinValue(x,rng){ const m=x/12, elig=COIN_TIERS.filter(t=>t.d<=m), rr=rng();
    let idx = rr<0.55 ? elig.length-3 : rr<0.85 ? elig.length-2 : elig.length-1;
    idx=Math.min(Math.max(0,idx),elig.length-1); return elig[idx].v; }
  function reset(){
    applyLoadout();
    const sx=flatStart();
    G={state:'play',t:0,x:sx,y:ground(sx)-VEH.wr,vx:0,vy:0,angle:slopeAt(sx),angVel:0,onGround:true,
       fuel:FUELMAX,dist:0,best:+(localStorage.getItem('eh:best')||0),wheel:0,dry:0,flipT:0,coins:0,air:0,spin:0,flips:0,susY:0,susV:0};
    pops=[];
    const r=DAILY?DAILY.rng:lrng(SEED);
    cans=[]; let cx=820; for(let i=0;i<80;i++){cx+=720+r()*900; cans.push({x:cx,got:false});}
    coins=[]; let px=420; for(let i=0;i<800;i++){px+=110+r()*230; coins.push({x:px,got:false,val:coinValue(px,r)});}
    decos=[]; let dx=180; for(let i=0;i<500;i++){dx+=150+r()*280; decos.push({x:dx,h:0.6+r()*0.8});}
  }

  let gas=false, brake=false;
  function bindPedal(el,set){
    const on=e=>{e.preventDefault();ac();set(true);el.classList.add('on');};
    const off=e=>{e.preventDefault();set(false);el.classList.remove('on');};
    el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);
    el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);
  }
  bindPedal(document.getElementById('pGas'),v=>gas=v);
  bindPedal(document.getElementById('pBrake'),v=>brake=v);
  addEventListener('keydown',e=>{const k=e.key.toLowerCase();
    if(k==='arrowright'||k==='d'){gas=true;ac();} if(k==='arrowleft'||k==='q'){brake=true;ac();}
    if(k==='p'||k==='escape')togglePause();});
  addEventListener('keyup',e=>{const k=e.key.toLowerCase();
    if(k==='arrowright'||k==='d')gas=false; if(k==='arrowleft'||k==='q')brake=false;});

  // ---------- physique (Hill-Climb : châssis balistique + appui par roue) ----------
  const PHYS = {
    drive: 1.0,        // facteur sur la puissance moteur (EF)
    roll: 0.45,        // résistance au roulement /s
    muS: 0.35,         // friction statique : à l'arrêt, tient jusqu'à ~19° de pente
    muK: 0.22,         // friction cinétique au-delà (la voiture glisse)
    idleStop: 22,      // en deçà de cette vitesse, on s'immobilise net (zéro creep)
    holdDamp: 12.0,    // freinage vers l'arrêt sur pente tenable
    revMax: 210,       // vitesse de marche arrière max (frein)
    align: 11,         // vitesse d'alignement du châssis sur le sol /s
    crashTilt: 2.2,    // inclinaison max tolérée à l'atterrissage (rad) — tolérant (crash ~sur le toit seulement)
    airDrag: 0.03,     // traînée horizontale en l'air /s
    bounce: 0.10,      // rebond à l'impact (0 = sec, 1 = trampoline)
    airLevel: 3.0,     // auto-stabilisation en l'air quand on ne touche à rien
    airRotMax: 5.0,    // vitesse de rotation aérienne max (rad/s)
    susK: 80,          // raideur ressort de suspension (visuel)
    susD: 10,          // amortissement suspension (sous-amorti -> rebond)
    susImpact: 0.4,    // compression par unité de vitesse d'impact
    susRest: 2         // compression de repos (la voiture est "chargée" sur ses suspensions)
  };
  function physics(sdt){
    const canGas = gas && G.fuel>0, wb=VEH.wb, wr=VEH.wr;
    const wasAir = !G.onGround;
    // 1) gravité + intégration balistique (le châssis est un vrai corps libre)
    G.vy += GRAV*sdt;
    G.x  += G.vx*sdt;
    G.y  += G.vy*sdt;
    G.angle += G.angVel*sdt;
    // 2) sol sous chaque roue, pente locale et hauteur d'appui du châssis
    const c=Math.cos(G.angle);
    const rg=ground(G.x - c*wb), fg=ground(G.x + c*wb);
    const slope = clamp(Math.atan2(fg-rg, 2*wb), -1.3, 1.3);
    const supportY = (rg+fg)/2 - wr;
    // 3) contact si le centre du châssis atteint la hauteur d'appui
    if(G.y >= supportY - 0.5){
      // ---- AU SOL ----
      G.onGround = true; G.air = 0;
      // décompose la vélocité : tangente (le long de la pente) + normale (perpendiculaire au sol)
      let vt = G.vx*Math.cos(slope) + G.vy*Math.sin(slope);
      let vn = G.vx*Math.sin(slope) - G.vy*Math.cos(slope);  // >0 = s'éloigne du sol (vers le haut)
      if(canGas) vt += EF*GRIPK*PHYS.drive*sdt;     // moteur (l'adhérence aide à grimper)
      if(brake)  vt -= BF*sdt;
      vt += GRAV*Math.sin(slope)*sdt;               // gravité le long de la pente — signe correct : on descend, on freine en montée
      vt *= (1 - PHYS.roll*sdt);                    // roulement
      if(!canGas && !brake){                        // sans gaz ni frein : friction (tient sur pente modérée, glisse sur pente raide)
        if(Math.abs(Math.tan(slope)) <= PHYS.muS){  // pente tenable -> on s'immobilise (pas de creep)
          if(Math.abs(vt) < PHYS.idleStop) vt = 0;
          else vt -= vt*Math.min(1, PHYS.holdDamp*sdt);
        } else {                                     // pente trop raide -> glisse, friction cinétique
          vt -= Math.sign(vt||Math.sin(slope))*PHYS.muK*GRAV*Math.cos(slope)*sdt;
        }
      }
      vt = clamp(vt, -PHYS.revMax, TOP);
      // réponse normale : on absorbe l'enfoncement mais on GARDE l'élan vers le haut -> vrais tremplins
      if(vn < 0){ G.susV += Math.min(260,-vn)*PHYS.susImpact; vn = -vn*PHYS.bounce; }  // compresse la suspension (visuel)
      // alignement du châssis sur la pente (instantané à l'atterrissage, lissé sinon)
      if(wasAir){
        const tilt = Math.abs(angNorm(G.angle - slope));
        if(tilt > PHYS.crashTilt){ crash('Atterrissage raté'); return; }
        blip(tilt>0.9?180:250, .05, tilt>0.9?'sawtooth':'square', .03);
        G.angle = slope; G.spin = 0;
      } else {
        G.angle += angNorm(slope - G.angle) * Math.min(1, PHYS.align*sdt);
      }
      G.angVel = 0;
      if(G.y > supportY) G.y = supportY;            // anti-pénétration (sans coller quand on s'élève)
      G.vx = vt*Math.cos(slope) + vn*Math.sin(slope);
      G.vy = vt*Math.sin(slope) - vn*Math.cos(slope);
    } else {
      // ---- EN L'AIR ----
      G.onGround = false; G.air += sdt;
      if(canGas)      G.angVel -= AIRROT*sdt;        // gaz = bascule en arrière (backflip contrôlé)
      else if(brake)  G.angVel += AIRROT*sdt;        // frein = bascule en avant
      else {                                          // aucun input : auto-stabilisation vers l'horizontale
        G.angVel -= G.angVel*Math.min(1, PHYS.airLevel*sdt);
        G.angle  += angNorm(0 - G.angle)*Math.min(1, PHYS.airLevel*0.4*sdt);
      }
      G.angVel = clamp(G.angVel, -PHYS.airRotMax, PHYS.airRotMax);
      G.spin = (G.spin||0) + G.angVel*sdt;
      if(Math.abs(G.spin) >= 6.2832){ G.spin -= Math.sign(G.spin)*6.2832; G.flips=(G.flips||0)+1; banner('SALTO !','#9fe8ff'); blip(880,.12,'triangle',.04); }
      G.vx *= (1 - PHYS.airDrag*sdt);
    }
    // 4) suspension visuelle (ressort amorti vers une compression de repos, n'affecte pas la collision)
    G.susV += (-PHYS.susK*((G.susY||0)-PHYS.susRest) - PHYS.susD*(G.susV||0))*sdt;
    G.susY = clamp((G.susY||0) + G.susV*sdt, -7, 11);
    // usure roue, conso, ramassages, retournement, panne sèche
    G.wheel += G.vx*sdt*0.07; G.t += sdt;
    G.fuel = Math.max(0, G.fuel - (canGas?3.6:1.2)*sdt);
    for(const cc of coins){ if(cc.got)continue; if(cc.x<G.x-70)continue; if(cc.x>G.x+70)break;
      if(Math.abs(cc.x-G.x)<26 && Math.abs((ground(cc.x)-40)-G.y)<66){cc.got=true;G.coins+=cc.val;pops.push({x:cc.x,y:ground(cc.x)-46,t:1,txt:'+'+cc.val});blip(1100+Math.min(900,cc.val*6),.05,'square',.03);} }
    for(const cn of cans){ if(cn.got)continue; if(Math.abs(cn.x-G.x)<26 && Math.abs((ground(cn.x)-36)-G.y)<70){
      cn.got=true; G.fuel=Math.min(FUELMAX,G.fuel+40); blip(880,.12,'sine',.05); banner('+ CARBURANT','#ffd27a'); } }
    if(G.onGround && Math.abs(angNorm(G.angle))>2.0){ G.flipT+=sdt; if(G.flipT>0.4){ crash('Sur le toit !'); return; } } else G.flipT=0;
    if(G.fuel<=0 && Math.abs(G.vx)<20 && G.onGround){ G.dry+=sdt; if(G.dry>1.4) crash('Panne sèche'); }
    else if(G.fuel>0||Math.abs(G.vx)>=20) G.dry=0;
  }

  let bannerT=0,bannerTxt='',bannerCol='#fff';
  function banner(t,c){bannerTxt=t;bannerCol=c||'#fff';bannerT=1.6;}
  function crash(reason){ if(G.state!=='play')return; G.state='dead'; G.crashReason=reason; blip(150,.4,'sawtooth',.06); endGame(); }

  // ---------- dessin véhicule (un seul rendu, partagé jeu + aperçu menu) ----------
  function drawVehicleOn(g,v,spin,dip){
    function R(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
    function wheel(sx){g.save();g.translate(sx,14);
      g.fillStyle='#16161e';g.beginPath();g.arc(0,0,v.wr,0,6.28);g.fill();
      g.strokeStyle='#ff7a3c';g.lineWidth=3;g.beginPath();g.arc(0,0,v.wr,0,6.28);g.stroke();
      g.rotate(spin);g.strokeStyle='#6a6a76';g.lineWidth=2;
      for(let k=0;k<4;k++){g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(k*1.57)*v.wr*0.8,Math.sin(k*1.57)*v.wr*0.8);g.stroke();}
      g.restore();}
    wheel(-v.wb); wheel(v.wb);
    g.save(); g.translate(0, dip||0);            // débattement de suspension : le corps plonge/rebondit, roues au sol
    const bg=g.createLinearGradient(0,-12,0,14); bg.addColorStop(0,'#ffd27a');bg.addColorStop(1,'#ff7a3c'); g.fillStyle=bg;
    if(v.body==='buggy'){ R(-30,-6,60,20,7);g.fill(); g.fillStyle='#ff7a3c';R(-16,-22,34,18,6);g.fill();
      g.fillStyle='rgba(150,230,255,0.55)';R(-12,-19,26,12,4);g.fill();
      g.fillStyle='#fff';g.beginPath();g.arc(0,-13,5,0,6.28);g.fill();g.fillStyle='#ffd27a';g.beginPath();g.arc(0,-13,3,0,6.28);g.fill(); }
    else if(v.body==='moto'){ g.strokeStyle='#ff7a3c';g.lineWidth=4;g.beginPath();g.moveTo(-v.wb,14);g.lineTo(0,-6);g.lineTo(v.wb,14);g.moveTo(0,-6);g.lineTo(8,-2);g.stroke();
      R(-8,-10,20,8,3);g.fill();
      g.fillStyle='#fff';g.beginPath();g.arc(-2,-20,5,0,6.28);g.fill();g.fillStyle='#ffd27a';g.beginPath();g.arc(-2,-20,3,0,6.28);g.fill();
      g.strokeStyle='#ffd27a';g.lineWidth=3;g.beginPath();g.moveTo(-2,-16);g.lineTo(6,-4);g.stroke(); }
    else { R(-34,-10,68,24,6);g.fill(); g.fillStyle='#ff7a3c';R(-30,-30,30,22,5);g.fill();
      g.fillStyle='rgba(150,230,255,0.5)';R(-26,-26,22,12,3);g.fill();
      g.fillStyle='#22222e';R(2,-26,30,18,4);g.fill();
      g.fillStyle='#fff';g.beginPath();g.arc(-15,-20,5,0,6.28);g.fill();g.fillStyle='#ffd27a';g.beginPath();g.arc(-15,-20,3,0,6.28);g.fill(); }
    g.restore();
  }

  // ---------- rendu monde ----------
  function render(){
    const camX=G.x-W*0.30, camY=clamp(G.y-H*0.52,-H*0.6,H*1.2);
    const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,BIOME.sky[0]);sky.addColorStop(0.55,BIOME.sky[1]);sky.addColorStop(1,BIOME.sky[2]);
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    const mx=W*0.78,my=H*0.20; const hg=ctx.createRadialGradient(mx,my,4,mx,my,90);
    hg.addColorStop(0,'rgba(255,220,160,0.5)');hg.addColorStop(1,'rgba(255,220,160,0)');ctx.fillStyle=hg;ctx.fillRect(mx-90,my-90,180,180);
    ctx.fillStyle='#ffe6b0';ctx.beginPath();ctx.arc(mx,my,26,0,6.28);ctx.fill();
    for(let i=0;i<60;i++){const sx=((i*167.3)%W),sy=(i*97.7)%(H*0.5);ctx.fillStyle=BIOME.star;ctx.globalAlpha=0.2+(i%5)*0.1;ctx.fillRect(sx,sy,1.6,1.6);}
    ctx.globalAlpha=1;
    const layers=[{p:0.18,c:BIOME.gnd[0],a:0.4,base:0.58,amp:90},{p:0.34,c:BIOME.gnd[1],a:0.55,base:0.66,amp:70},{p:0.52,c:BIOME.gnd[0],a:0.7,base:0.74,amp:52}];
    for(const L of layers){ const off=camX*L.p; ctx.fillStyle=L.c; ctx.globalAlpha=L.a;
      ctx.beginPath();ctx.moveTo(0,H);
      for(let sx=0;sx<=W;sx+=16){const wx=sx+off;const hy=H*L.base - Math.sin(wx*0.0018)*L.amp - Math.sin(wx*0.0051)*L.amp*0.4 - camY*L.p*0.35;ctx.lineTo(sx,hy);}
      ctx.lineTo(W,H);ctx.closePath();ctx.fill(); }
    ctx.globalAlpha=1;
    ctx.save(); ctx.translate(-camX,-camY);
    const x0=camX-30,x1=camX+W+30;
    for(const d of decos){ if(d.x<x0-40||d.x>x1+40)continue; const gy=ground(d.x);
      if(BIOME.decor==='tree'){ ctx.strokeStyle='#2a1c30';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(d.x,gy);ctx.lineTo(d.x,gy-40*d.h);ctx.stroke();
        ctx.fillStyle='#3a4d3a';ctx.beginPath();ctx.arc(d.x,gy-44*d.h,16*d.h,0,6.28);ctx.fill(); }
      else if(BIOME.decor==='cactus'){ ctx.strokeStyle='#3c5a30';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();
        ctx.moveTo(d.x,gy);ctx.lineTo(d.x,gy-40*d.h);ctx.moveTo(d.x,gy-24*d.h);ctx.lineTo(d.x+10,gy-30*d.h);ctx.stroke();ctx.lineCap='butt'; }
      else { ctx.fillStyle='#2c2630';ctx.beginPath();ctx.ellipse(d.x,gy-6,14*d.h,9*d.h,0,0,6.28);ctx.fill(); } }
    ctx.beginPath(); ctx.moveTo(x0,ground(x0));
    for(let wx=x0;wx<=x1;wx+=7) ctx.lineTo(wx,ground(wx));
    ctx.lineTo(x1,camY+H+300);ctx.lineTo(x0,camY+H+300);ctx.closePath();
    const tg=ctx.createLinearGradient(0,G.y-120,0,G.y+320); tg.addColorStop(0,BIOME.gnd[0]);tg.addColorStop(0.5,BIOME.gnd[1]);tg.addColorStop(1,BIOME.gnd[2]);
    ctx.fillStyle=tg; ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
    for(let wx=Math.floor(x0/40)*40;wx<=x1;wx+=40){const gy=ground(wx);ctx.beginPath();ctx.moveTo(wx,gy+6);ctx.lineTo(wx-10,gy+34);ctx.stroke();}
    ctx.strokeStyle=BIOME.rim; ctx.lineWidth=3; ctx.shadowColor=BIOME.rim;ctx.shadowBlur=10;
    ctx.beginPath(); ctx.moveTo(x0,ground(x0));
    for(let wx=x0;wx<=x1;wx+=7) ctx.lineTo(wx,ground(wx)); ctx.stroke(); ctx.shadowBlur=0;
    for(let m=Math.max(250,Math.floor((x0/12)/250)*250);m*12<x1;m+=250){const wx=m*12;if(wx<x0)continue;const gy=ground(wx);
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(wx,gy);ctx.lineTo(wx,gy-26);ctx.stroke();
      ctx.fillStyle='#ffd27a';ctx.font='10px JetBrains Mono';ctx.textAlign='center';ctx.fillText(m+'m',wx,gy-30);}
    for(const c of coins){ if(c.got||c.x<x0-30||c.x>x1+30)continue; const gy=ground(c.x)-40, yb=gy+Math.sin(G.t*4+c.x)*3;
      const col=c.val>=100?'#9fe8ff':c.val>=25?'#ffd27a':c.val>=5?'#ffe6b0':'#ffd27a', rad=c.val>=100?11:c.val>=25?9:c.val>=5?7.5:6;
      ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(c.x,yb,rad,0,6.28);ctx.fill();ctx.shadowBlur=0;
      if(c.val>=5){ctx.fillStyle='#0a0a12';ctx.font='700 '+(c.val>=100?10:9)+'px JetBrains Mono';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.val,c.x,yb+1);ctx.textAlign='left';ctx.textBaseline='alphabetic';} }
    for(const c of cans){ if(c.got||c.x<x0-40||c.x>x1+40)continue; const gy=ground(c.x)-36;
      ctx.fillStyle='#ff7a3c';ctx.fillRect(c.x-9,gy-14,18,24);ctx.fillStyle='#ffe6b0';ctx.fillRect(c.x-6,gy-10,12,5); }
    // pop-ups
    for(const p of pops){ if(p.t<=0)continue; ctx.globalAlpha=Math.min(1,p.t); ctx.fillStyle='#ffd27a';ctx.font='700 14px Space Grotesk';ctx.textAlign='center';
      ctx.fillText(p.txt,p.x,p.y-(1-p.t)*26);ctx.globalAlpha=1; }
    ctx.save(); ctx.translate(G.x,G.y); ctx.rotate(G.angle);
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(0,18,34,8,0,0,6.28);ctx.fill();
    drawVehicleOn(ctx,VEH,G.wheel,G.susY); ctx.restore();
    ctx.restore();
    drawGauges();
    if(bannerT>0){ ctx.globalAlpha=Math.min(1,bannerT/0.4); ctx.fillStyle=bannerCol; ctx.font='700 22px Space Grotesk';
      ctx.textAlign='center';ctx.fillText(bannerTxt,W/2,H*0.24);ctx.globalAlpha=1;ctx.textAlign='left'; }
    if(G.state==='paused'){ ctx.fillStyle='rgba(6,6,12,.6)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='700 30px Space Grotesk';ctx.textAlign='center';ctx.fillText('Pause',W/2,H/2);
      ctx.fillStyle=BIOME.rim;ctx.font='500 13px JetBrains Mono';ctx.fillText('appuie sur ❚❚ pour reprendre',W/2,H/2+28);ctx.textAlign='left'; }
  }
  function drawGauges(){
    const cx=W/2, gy=H-58;
    // bulle d'équilibre
    const tilt=clamp(Math.abs(angNorm(G.angle)),0,2.35), warn=tilt/2.35;
    ctx.save();ctx.globalAlpha=0.9;
    ctx.fillStyle='rgba(8,8,14,.55)';ctx.beginPath();ctx.arc(cx-46,gy,22,0,6.28);ctx.fill();
    ctx.strokeStyle=warn>0.7?'#ff5d6c':'rgba(255,255,255,.4)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx-46,gy,22,0,6.28);ctx.stroke();
    ctx.save();ctx.translate(cx-46,gy);ctx.rotate(angNorm(G.angle));
    ctx.strokeStyle=warn>0.7?'#ff5d6c':'#5fe3c8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.stroke();ctx.restore();
    // jauge vitesse
    const sp=Math.min(1,Math.abs(G.vx)/TOP);
    ctx.fillStyle='rgba(8,8,14,.55)';ctx.beginPath();ctx.arc(cx+46,gy,22,0,6.28);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx+46,gy,16,Math.PI*0.75,Math.PI*0.75+1.5*Math.PI);ctx.stroke();
    ctx.strokeStyle='#ff7a3c';ctx.beginPath();ctx.arc(cx+46,gy,16,Math.PI*0.75,Math.PI*0.75+1.5*Math.PI*sp);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='600 12px JetBrains Mono';ctx.textAlign='center';ctx.fillText(Math.round(Math.abs(G.vx)*0.16),cx+46,gy+4);
    ctx.textAlign='left';ctx.restore();
  }

  function updateHUD(){
    G.dist=Math.max(G.dist,Math.floor(G.x/12));
    document.getElementById('dist').textContent=G.dist+' m';
    document.getElementById('spd').textContent=Math.round(Math.abs(G.vx)*0.16);
    document.getElementById('coins').textContent=G.coins;
    document.getElementById('fuel').style.width=(G.fuel/FUELMAX*100)+'%';
    document.getElementById('fuel').style.background=G.fuel/FUELMAX<0.25?'linear-gradient(90deg,#ff5d6c,#ff9a3c)':'linear-gradient(90deg,#ff7a3c,#ffd27a)';
  }

  let last=performance.now();
  function loop(now){
    const dt=Math.min(.05,(now-last)/1000); last=now; requestAnimationFrame(loop);
    if(G.state==='play'){ const STEPS=6,sdt=dt/STEPS;
      for(let i=0;i<STEPS&&G.state==='play';i++) physics(sdt);
      for(const p of pops)p.t-=dt*1.2;
      if(bannerT>0)bannerT-=dt; updateHUD(); engineSound(G.vx);
    } else engineSound(0);
    if(G.state==='play'||G.state==='dead'||G.state==='paused') render();
  }

  function togglePause(){ if(G.state==='play'){G.state='paused';} else if(G.state==='paused'){G.state='play';last=performance.now();} }
  document.getElementById('pause').onclick=togglePause;

  function endGame(){
    const best=+(localStorage.getItem('eh:best')||0);
    if(G.dist>best) localStorage.setItem('eh:best',G.dist);
    if(window.GamePortal&&GamePortal.addCoins) GamePortal.addCoins(G.coins,'emberhill');
    else setCoins(getCoins()+G.coins);
    if(window.GamePortal&&GamePortal.addXP){
      GamePortal.addXP(Math.floor(G.dist/8),'emberhill');
      GamePortal.unlock('eh_first');
      if(G.dist>=1000)GamePortal.unlock('eh_1km');
      if(G.dist>=5000)GamePortal.unlock('eh_5km');
      if((G.flips||0)>0)GamePortal.unlock('eh_flip'); }
    document.getElementById('pause').style.display='none';
    document.getElementById('overTitle').textContent=G.crashReason;
    document.getElementById('overScore').textContent=G.dist+' m';
    document.getElementById('overSub').textContent='record '+Math.max(best,G.dist)+' m · ◉ '+G.coins+' pièces ramassées';
    submit();
    setTimeout(()=>document.getElementById('over').classList.remove('hidden'),450);
  }
  function submit(){
    const nl=document.getElementById('netLine'), box=document.getElementById('lbBox'); box.innerHTML='';
    if(!window.GamePortal){nl.textContent='';return;}
    const meta={dist:G.dist,coins:G.coins,veh:VEH.id,stage:BIOME.id};
    GamePortal.finishRun(G.dist, meta, {daily:!!DAILY, gameId:'emberhill', netEl:nl, lbEl:box});
  }

  // ---------- écrans du menu ----------
  function bar(val,max){return '<div class="sb"><i style="width:'+Math.round(val/max*100)+'%"></i></div>';}
  function renderVehPreview(){
    const pc=document.getElementById('vprev'); const w=pc.clientWidth||300,h=130; pc.width=w*DPR;pc.height=h*DPR;
    const p=pc.getContext('2d'); p.setTransform(DPR,0,0,DPR,0,0); p.clearRect(0,0,w,h);
    p.strokeStyle=BIOME.rim;p.lineWidth=2;p.beginPath();p.moveTo(0,h-30);p.lineTo(w,h-30);p.stroke();
    p.save();p.translate(w/2,h-44);p.scale(1.15,1.15);
    drawVehicleOn(p,VEH,0); p.restore();   // même rendu que le jeu (fonction unifiée)
  }
  function renderPlay(){
    document.getElementById('hdrCoins').textContent=getCoins();
    document.getElementById('hdrBest').textContent=(+(localStorage.getItem('eh:best')||0));
    document.getElementById('playInfo').textContent=VEH.name+' · stage : '+BIOME.name;
    renderVehPreview();
  }
  function renderVeh(){
    const wrap=document.getElementById('vehCards'); wrap.innerHTML=''; const owned=ownedVeh(), sel=selVehId();
    VEHICLES.forEach(v=>{const own=owned.includes(v.id),isSel=v.id===sel,afford=getCoins()>=v.cost;
      const c=document.createElement('div');c.className='card'+(isSel?' sel':'');
      c.innerHTML='<div class="nm">'+v.name+'</div>'+
        '<div class="st">moteur'+bar(v.ef-1200,700)+'vitesse'+bar(v.top-400,300)+'carburant'+bar(v.fuel,160)+'stabilité'+bar(2-v.air,1.6)+'</div>'+
        (own?'<button class="'+(isSel?'owned':'')+'">'+(isSel?'✓ Choisi':'Choisir')+'</button>'
            :'<button '+(afford?'':'disabled')+'>◉ '+v.cost+'</button>');
      const b=c.querySelector('button');
      if(own&&!isSel)b.onclick=()=>{localStorage.setItem('eh:car',v.id);VEH=currentVehicle();renderVeh();renderPlay();blip(700,.08,'triangle',.04);};
      else if(!own&&afford)b.onclick=()=>{setCoins(getCoins()-v.cost);const o=ownedVeh();o.push(v.id);saveOwned(o);localStorage.setItem('eh:car',v.id);VEH=currentVehicle();renderVeh();renderPlay();blip(900,.12,'triangle',.05);};
      wrap.appendChild(c);});
  }
  function renderStage(){
    const wrap=document.getElementById('stageCards'); wrap.innerHTML='';
    if(DAILY){wrap.innerHTML='<div class="st" style="padding:10px">Le défi du jour impose le stage <b style="color:#ffd27a">'+BIOME.name+'</b> à tous les joueurs.</div>';return;}
    const sel=biomeIndex(), owned=ownedStages();
    BIOMES.forEach((b,i)=>{const own=owned.includes(b.id), isSel=i===sel, afford=getCoins()>=(b.cost||0);
      const c=document.createElement('div');c.className='card'+(isSel?' sel':'');
      c.innerHTML='<div class="nm">'+b.name+'</div><div class="st" style="margin:7px 0 10px">'+b.hint+'</div>'+
        (own?'<button class="'+(isSel?'owned':'')+'">'+(isSel?'✓ Choisi':'Choisir')+'</button>'
            :'<button '+(afford?'':'disabled')+'>◉ '+b.cost+'</button>');
      const btn=c.querySelector('button');
      if(own&&!isSel)btn.onclick=()=>{localStorage.setItem('eh:stage',i);BIOME=currentBiome();renderStage();renderPlay();blip(700,.08,'triangle',.04);};
      else if(!own&&afford)btn.onclick=()=>{setCoins(getCoins()-(b.cost||0));const o=ownedStages();o.push(b.id);saveStages(o);localStorage.setItem('eh:stage',i);BIOME=currentBiome();if(window.GamePortal&&b.id==='moon')GamePortal.unlock('eh_moon');renderStage();renderPlay();blip(900,.12,'triangle',.05);};
      wrap.appendChild(c);});
  }
  function renderGarage(){
    const up2=loadUp(), list=document.getElementById('upList'); list.innerHTML='';
    UPG.forEach(u=>{const lv=up2[u.id]||0,maxed=lv>=u.max,cost=u.cost(lv),afford=getCoins()>=cost;
      let bars='';for(let i=0;i<u.max;i++)bars+='<span class="'+(i<lv?'f':'')+'"></span>';
      const row=document.createElement('div');row.className='uprow';
      row.innerHTML='<div class="ic">'+u.ic+'</div><div class="ii"><div class="t">'+u.name+'</div>'+
        '<div class="d">'+u.desc+'</div><div class="lvbar">'+bars+'</div></div>'+
        '<button class="upbtn" '+((maxed||!afford)?'disabled':'')+'>'+(maxed?'MAX':'◉ '+cost)+'</button>';
      const b=row.querySelector('button');
      if(!maxed&&afford)b.onclick=()=>{const u3=loadUp();u3[u.id]=(u3[u.id]||0)+1;saveUp(u3);setCoins(getCoins()-cost);blip(760,.1,'triangle',.04);renderGarage();renderPlay();};
      list.appendChild(row);});
  }

  const SCREENS={play:'scrPlay',veh:'scrVeh',stage:'scrStage',garage:'scrGarage'};
  const NAV={play:'navPlay',veh:'navVeh',stage:'navStage',garage:'navGarage'};
  let curScreen='play';
  function showScreen(s){ curScreen=s; for(const k in SCREENS){document.getElementById(SCREENS[k]).classList.toggle('on',k===s);document.getElementById(NAV[k]).classList.toggle('on',k===s);}
    if(s==='veh')renderVeh(); else if(s==='stage')renderStage(); else if(s==='garage')renderGarage(); else renderPlay(); }
  // quand le portefeuille global se synchronise (cloud), rafraîchit l'écran de menu affiché
  window.addEventListener('gp:wallet',()=>{ if(!document.getElementById('menu').classList.contains('hidden')) showScreen(curScreen); });
  document.getElementById('navVeh').onclick=()=>{ac();blip(560,.04,'triangle',.03);showScreen('veh');};
  document.getElementById('navStage').onclick=()=>{ac();blip(560,.04,'triangle',.03);showScreen('stage');};
  document.getElementById('navGarage').onclick=()=>{ac();blip(560,.04,'triangle',.03);showScreen('garage');};

  function start(){ ac(); reset();
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('over').classList.add('hidden');
    document.getElementById('pause').style.display='block';
  }
  function toMenu(){ document.getElementById('over').classList.add('hidden'); document.getElementById('pause').style.display='none';
    applyLoadout(); showScreen('play'); document.getElementById('menu').classList.remove('hidden'); }
  document.getElementById('navPlay').onclick=start;
  document.getElementById('retryBtn').onclick=start;
  document.getElementById('toMenuBtn').onclick=toMenu;

  const PARAMS=new URLSearchParams(location.search);
  if(PARAMS.get('daily')==='1' && window.GamePortal){
    DAILY=GamePortal.daily(); seedTerrain(DAILY.rng);
    const b=document.getElementById('dailyBadge'); b.textContent='DÉFI DU JOUR · '+DAILY.date; b.style.display='block';
  } else { seedTerrain(lrng(SEED)); }
  applyLoadout(); reset(); G.state='menu'; showScreen('play');
  requestAnimationFrame(loop);
  if(window.GamePortal){ GamePortal.init({gameId:'emberhill'}).then(()=>{
    // migration une fois le portefeuille cloud chargé (évite la course avec loadWallet)
    if(!localStorage.getItem('eh:migrated')){ const old=+(localStorage.getItem('eh:coins')||0); if(old>0&&GamePortal.addCoins)GamePortal.addCoins(old,'emberhill-migration',{silent:true}); localStorage.setItem('eh:migrated','1'); }
    if(!document.getElementById('menu').classList.contains('hidden')) showScreen(curScreen);
  }); }
})();
</script>
</body>
</html>
