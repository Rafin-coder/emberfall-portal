# Configuration Netlify
[build]
  publish = "public"
  # Génère public/config.js depuis les variables d'environnement (déploiement Git).
  # En glisser-déposer, cette commande est ignorée et ton config.js local est utilisé tel quel.
  command = "node build-config.js"

# En-têtes de sécurité pour un portail de jeux.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # CSP réglée sur les seules origines réellement utilisées :
    #   - Google Fonts (style + font), Supabase (API REST + Realtime), esm.sh (client Supabase en module ES).
    #   - 'unsafe-inline' est requis car les jeux embarquent leur JS/CSS inline ; le reste (connect-src,
    #     object-src, base-uri, frame-ancestors) bloque l'exfiltration de données et le détournement.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh https://cdn.esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh https://cdn.esm.sh; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'self'; upgrade-insecure-requests"

# Le SDK et la config peuvent être mis en cache courtement.
[[headers]]
  for = "/sdk.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Musiques (lourdes, immuables) : cache très long pour éviter de les recharger.
[[headers]]
  for = "/games/emberfall/music.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/games/ageofwar/music.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Feuille de style partagée : cache d'une journée.
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
